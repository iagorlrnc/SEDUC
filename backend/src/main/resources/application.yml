spring:
  application:
    name: sisaluno
  profiles:
    active: prod # default profile uses PostgreSQL
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
server:
  tomcat:
    max-http-header-size: 1048576
    max-http-form-post-size: 50MB

# JWT Properties
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 hours

# Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    br.gov.to.seduc.sisaluno: DEBUG
    org.springframework.security: INFO

---
# H2 Fallback/Development Profile
spring:
  config:
    activate:
      on-profile: dev-h2
  datasource:
    url: jdbc:h2:mem:seduc_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
server:
  tomcat:
    max-http-header-size: 1048576

# JWT Properties for H2 Profile
security:
  jwt:
    secret: 5573656473635f746f63616e74696e735f7365637265745f6b65795f73797374656d5f7765625f616c756e6f73
    expiration-ms: 86400000
